<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>capTemplate PDFs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Available PDFs</h1>
  <p class="intro">The documents are listed in the order they are meant to be
  read, which is not the order in which they are written. Reading them in this
  order follows the rational design process the project documentation
  presents.</p>
  <p class="generated-line">Site generated <!-- GENERATED --></p>
  <!-- PDF_LIST -->

  <script>
    // Times are written into the page as UTC, because the machine that builds
    // the site runs in UTC and cannot know where it will be read. Rewrite them
    // in the reader's own timezone. If this does not run, the UTC text that
    // was written into each element stands on its own.
    (function () {
      var stamps = document.querySelectorAll('time[datetime]');
      for (var i = 0; i < stamps.length; i++) {
        var el = stamps[i];
        var when = new Date(el.getAttribute('datetime'));
        if (isNaN(when.getTime())) continue;
        var shown;
        try {
          shown = when.toLocaleString(undefined, {
            year: 'numeric', month: 'short', day: 'numeric',
            hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
          });
        } catch (e) {
          continue;  // very old browser: leave the UTC text in place
        }
        el.textContent = (el.getAttribute('data-prefix') || '') + shown;
        el.title = 'UTC: ' + el.getAttribute('datetime');
      }
    })();
  </script>
</body>
</html>
